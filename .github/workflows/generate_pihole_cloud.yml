name: generate_pihole_cloud

on:
  push:
    paths:
      - 'adguard-allowlist-cloudgaming'    # ← geändert
  workflow_dispatch:

jobs:
  convert-cloud:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Whitelist to Pi-hole
        run: |
          if [ -f "adguard-allowlist-cloudgaming" ]; then    # ← geändert
            sed -e 's/@@||//g' -e 's/\^//g' -e 's/\$important//g' -e '/^!/d' -e '/^#/d' -e '/^$/d' "adguard-allowlist-cloudgaming" > pihole-cloudgaming.txt    # ← geändert
            echo "✅ Conversion successful"
          else
            echo "❌ Error: File 'adguard-allowlist-cloudgaming' not found!"    # ← geändert
            exit 1
          fi
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pihole-cloudgaming.txt
          git commit -m "Update Pi-hole list [auto]" || echo "No changes to commit"
          git push
